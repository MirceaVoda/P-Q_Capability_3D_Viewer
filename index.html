<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Portfolio Viewer</title>
<style>
:root{
  color-scheme: dark;
  --page:#0a1428; --surface-1:#13223f; --surface-2:#1a2d52; --surface-3:#223a66;
  --border:rgba(150,180,240,.16); --border-strong:rgba(150,180,240,.30);
  --text-primary:#eef3ff; --text-secondary:#b3c2e0; --text-muted:#8497bd;
  --grid:#22365c; --axis:#3a5283;
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.18);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#008300;
  --neg:#e66767; --pos:#3987e5;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --radius:10px;
  font-family: system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text-primary);font-size:14px}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
header.top{display:flex;align-items:center;gap:16px;padding:12px 20px;background:linear-gradient(90deg,#0d1b38,#112449);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
header.top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap}
header.top .src{color:var(--text-muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.btn{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{padding:4px 9px;font-size:12.5px}

/* ---------- layout ---------- */
.shell{display:flex;min-height:calc(100vh - 57px)}
nav.side{width:220px;flex:none;background:#0c1832;border-right:1px solid var(--border);padding:12px 8px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
nav.side .grp{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin:14px 10px 6px}
nav.side button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--text-secondary)}
nav.side button:hover{background:var(--surface-1);color:var(--text-primary)}
nav.side button.on{background:var(--accent-soft);color:var(--text-primary);box-shadow:inset 3px 0 0 var(--accent)}
nav.side .ico{width:18px;text-align:center;opacity:.9}
main{flex:1;min-width:0;padding:16px 20px 40px}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--text-muted)}
.filters select,.filters input{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 8px;min-width:120px;max-width:190px}
.filters input[type=search]{min-width:170px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{background:none;border:0;padding:5px 11px;border-radius:6px;cursor:pointer;color:var(--text-secondary);white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff}
.filters .spacer{flex:1}
.fcount{color:var(--text-muted);font-size:12.5px;align-self:flex-end;padding-bottom:6px}

/* ---------- cards ---------- */
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin:4px 0 12px}
.vhead h2{margin:0;font-size:20px;font-weight:650}
.vhead p{margin:3px 0 0;color:var(--text-muted);font-size:13px;max-width:780px}
.vhead .ctl{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;min-width:0}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--text-primary)}
.card h3 small{color:var(--text-muted);font-weight:400;margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>.card{margin-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.kpi .l{color:var(--text-muted);font-size:12px}
.kpi .v{font-size:22px;font-weight:650;margin-top:4px}
.kpi .s{color:var(--text-secondary);font-size:12px;margin-top:3px}

/* ---------- table ---------- */
.tbl-wrap{overflow:auto;max-height:620px;border-radius:8px;border:1px solid var(--border)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:#172a4d;color:var(--text-secondary);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border-strong);cursor:pointer;white-space:nowrap;user-select:none;z-index:1}
table.t th.r,table.t td.r{text-align:right}
table.t th .arr{color:var(--accent);margin-left:4px}
table.t td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover td{background:rgba(57,135,229,.08)}
table.t td.name{max-width:320px}
table.t td.name .n{font-weight:550}
table.t td.name .sub{color:var(--text-muted);font-size:11.5px}
table.t td.wrap{white-space:normal;min-width:240px;max-width:460px;color:var(--text-secondary)}
.rank{color:var(--text-muted);width:30px}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--border-strong);color:var(--text-primary);white-space:nowrap}
.chip i{font-style:normal;font-weight:700}
.chip.good i{color:var(--good)} .chip.warning i{color:var(--warning)} .chip.serious i{color:var(--serious)} .chip.critical i{color:var(--critical)} .chip.neutral i{color:var(--text-muted)}
.pill{display:inline-block;background:var(--surface-3);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--text-secondary);margin:1px 3px 1px 0}

/* ---------- charts ---------- */
svg text{fill:var(--text-secondary);font-size:11.5px}
svg .muted{fill:var(--text-muted)}
svg .lbl{fill:var(--text-primary)}
svg .hit{fill:transparent;cursor:pointer}
svg .hit:hover{fill:rgba(57,135,229,.07)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend b.line{height:3px;border-radius:2px}
#tip{position:fixed;pointer-events:none;background:#081226;border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;font-size:12.5px;z-index:100;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:none;line-height:1.45}
#tip .h{font-weight:650;margin-bottom:3px}
#tip .row{display:flex;justify-content:space-between;gap:16px;color:var(--text-secondary)}
#tip .row b{color:var(--text-primary);font-weight:600}

.warn{color:var(--warning);cursor:help;font-weight:700}
svg .warnt{fill:var(--warning);font-weight:700}
.warnnote{background:rgba(250,178,25,.10);border:1px solid rgba(250,178,25,.35);border-radius:7px;padding:6px 10px;margin:0 0 10px;font-size:12.5px;color:var(--text-secondary)}
.warnnote b{color:var(--text-primary)}
#sugg{position:fixed;z-index:60;width:min(560px,calc(100vw - 16px));max-height:min(480px,70vh);overflow:auto;background:#0c1832;border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.5);display:none}
#sugg .si{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer}
#sugg .si.on{background:var(--accent-soft)}
#sugg .sl{min-width:0}
#sugg .n{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sugg .sub{color:var(--text-muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sugg .sr{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12.5px}
#sugg .sf{padding:7px 12px;color:var(--text-muted);font-size:11.5px}
/* ---------- export menu ---------- */
.xmenu{position:relative}
.xmenu .btn:disabled{opacity:.45;cursor:default}
.xdrop{position:absolute;right:0;top:calc(100% + 6px);width:300px;background:#0c1832;border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.5);padding:6px;display:none;z-index:70}
.xdrop.open{display:block}
.xdrop button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:8px 10px;cursor:pointer}
.xdrop button:hover{background:var(--accent-soft)}
.xdrop button span{color:var(--text-muted);font-size:12px}
/* ---------- print modal ---------- */
.modal-scrim{position:fixed;inset:0;background:rgba(3,8,20,.6);z-index:80;display:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;background:var(--page);border:1px solid var(--border-strong);border-radius:12px;z-index:81;padding:18px 20px;display:none;box-shadow:0 16px 48px rgba(0,0,0,.6)}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:12px 0}
.modal .row2 label{display:flex;align-items:center;gap:8px;background:var(--surface-1);border:1px solid var(--border);border-radius:7px;padding:7px 10px;cursor:pointer;font-size:13px}
.modal .fld{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.modal .fld label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--text-muted)}
.modal .fld input,.modal .fld select{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 8px;min-width:120px}
.modal .fld input[type=text]{min-width:300px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
@media (max-width:600px){.modal .row2{grid-template-columns:1fr}.modal .fld input[type=text]{min-width:200px}}

/* ---------- print (white A4 landscape) ---------- */
#printRoot{display:none}
@media print{
  html,body{background:#fff!important}
  body.printing > *:not(#printRoot):not(style):not(script){display:none!important}
  body.printing #printRoot{display:block}
}
#printRoot{
  color-scheme:light;
  --page:#fff; --surface-1:#fff; --surface-2:#f3f6fb; --surface-3:#e6edf7;
  --border:#d5deea; --border-strong:#b9c6d8;
  --text-primary:#0b1b33; --text-secondary:#34445e; --text-muted:#66758e;
  --grid:#e3e8f0; --axis:#9aa9bf; --accent:#1c5cab; --accent-soft:#e3edfa;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --neg:#d03b3b; --pos:#2a78d6; --warning:#c98500;
  background:#fff; color:var(--text-primary); font-size:11px;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
#printRoot .btn,#printRoot .filters,#printRoot [data-optsel],#printRoot .scr{display:none!important}
#printRoot .seg{border:0;background:none;padding:0}
#printRoot .seg button:not(.on){display:none}
#printRoot .seg button.on{background:var(--accent-soft);color:var(--accent);font-size:10px;padding:2px 8px;font-weight:600}
#printRoot .vhead{margin:0 0 8px}
#printRoot .vhead h2{font-size:16px;color:var(--accent)}
#printRoot .vhead p{font-size:10.5px;max-width:none}
#printRoot .card{border-color:var(--border);padding:10px 12px;margin-bottom:10px;break-inside:avoid}
#printRoot .card:has(table.t){break-inside:auto}
#printRoot .card h3{font-size:12px}
#printRoot .kpis{grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
#printRoot .kpi{padding:8px 10px;break-inside:avoid}
#printRoot .kpi .v{font-size:17px}
#printRoot .tbl-wrap{max-height:none;overflow:visible;border-color:var(--border)}
#printRoot table.t{font-size:9.5px}
#printRoot table.t th{position:static;background:#eaf0f8;color:#1c3a66;padding:5px 6px}
#printRoot table.t td{padding:4px 6px}
#printRoot table.t td.wrap{min-width:0;max-width:none}
#printRoot tr{break-inside:avoid}
#printRoot thead{display:table-header-group}
#printRoot .psec{break-before:page}
#printRoot .grid2{gap:10px}
#printRoot .warnnote{background:#fff7e0;border-color:#f0d58a}
#printRoot svg text{font-size:11px}
#printRoot .cover{padding:30px 10px 0}
#printRoot .cover .brand{color:var(--accent);font-weight:700;letter-spacing:1px;font-size:12px}
#printRoot .cover h1{font-size:30px;margin:10px 0 6px;color:var(--text-primary)}
#printRoot .cover .meta{color:var(--text-secondary);font-size:12px;line-height:1.7}
#printRoot .cover .toc{columns:2;margin-top:18px;font-size:12px;line-height:1.8;padding-left:18px}
#printRoot .cover .conf{margin-top:24px;color:var(--text-muted);font-size:10.5px;border-top:1px solid var(--border);padding-top:8px}
#printRoot .vhdr{border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:10px}
#printRoot .vhdr b{color:var(--accent);font-size:12px}
#printRoot .vhdr div{color:var(--text-muted);font-size:10px}
/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,8,20,.55);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,100vw);background:var(--page);border-left:1px solid var(--border-strong);z-index:41;transform:translateX(100%);transition:transform .22s ease;overflow:auto;padding:18px 22px 40px}
.drawer.open{transform:none}
.drawer .close{position:sticky;top:0;float:right}
.drawer h2{margin:0 0 4px;font-size:20px}
.drawer .meta{color:var(--text-muted);font-size:13px;margin-bottom:10px}
.risk-item{background:var(--surface-2);border-left:3px solid var(--serious);border-radius:6px;padding:8px 10px;margin:6px 0;white-space:pre-wrap;color:var(--text-secondary);font-size:13px}
.dec-item{background:var(--surface-2);border-left:3px solid var(--warning);border-radius:6px;padding:8px 10px;margin:6px 0;font-size:13px}
.dec-item.crit{border-left-color:var(--critical)}

/* ---------- empty / drop ---------- */
.drop{max-width:720px;margin:8vh auto;text-align:center;border:2px dashed var(--border-strong);border-radius:16px;padding:48px 28px;background:var(--surface-1)}
.drop.over{border-color:var(--accent);background:var(--surface-2)}
.drop h2{margin:0 0 8px;font-size:22px}
.drop p{color:var(--text-secondary);margin:6px 0 18px}
.drop ul{text-align:left;color:var(--text-muted);font-size:13px;max-width:520px;margin:20px auto 0}
.err{color:var(--neg);margin-top:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--border-strong);padding:9px 16px;border-radius:8px;z-index:120;display:none}

/* ---------- settings ---------- */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 16px}
.wgrid label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);background:var(--surface-2);padding:6px 10px;border-radius:7px}
.wgrid input{width:70px;background:var(--surface-1);border:1px solid var(--border);border-radius:6px;padding:4px 6px;text-align:right}
.note{color:var(--text-muted);font-size:12.5px}

@media (max-width:900px){
  nav.side{display:none}
  .grid2{grid-template-columns:1fr}
  main{padding:12px 16px 40px}
  header.top{padding:10px 16px}
  #mnav{display:block!important}
}

/* ---------- project x BU matrix ---------- */
.mxwrap{overflow:auto;max-height:calc(100vh - 250px);border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-1)}
table.mx{border-collapse:separate;border-spacing:0;font-size:12.5px}
table.mx th,table.mx td{padding:0;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
table.mx thead th{position:sticky;top:0;z-index:3;background:#172a4d;color:var(--text-secondary);font-weight:600;padding:8px 6px;text-align:center;white-space:nowrap;min-width:64px;cursor:pointer}
table.mx thead th:hover{color:var(--text-primary)}
table.mx thead th.corner{left:0;z-index:5;text-align:left;min-width:300px;max-width:300px;padding-left:10px;cursor:default}
table.mx td.pn{position:sticky;left:0;z-index:2;background:var(--surface-1);padding:6px 10px;min-width:300px;max-width:300px;cursor:pointer}
table.mx td.pn .n{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
table.mx td.pn .sub{color:var(--text-muted);font-size:11px}
table.mx td.c{text-align:center;height:34px}
table.mx td.c.on{cursor:pointer}
table.mx td.c.on i{display:block;width:26px;height:18px;border-radius:5px;margin:0 auto;transition:transform .08s}
table.mx td.c.on:hover i{transform:scale(1.25);box-shadow:0 0 0 2px var(--text-primary)}
table.mx td.tot,table.mx th.tot{background:var(--surface-2);text-align:center;padding:6px 8px;font-weight:650;position:sticky;right:0;z-index:2}
table.mx thead th.tot{z-index:4;cursor:default}
table.mx tbody tr:hover td.pn,table.mx tbody tr:hover td.c:not(.on){background:rgba(57,135,229,.12)}
table.mx tfoot td{position:sticky;bottom:0;z-index:3;background:var(--surface-2);font-weight:650;text-align:center;padding:7px 6px;border-top:1px solid var(--border-strong)}
table.mx tfoot td.pn{left:0;z-index:4;text-align:left}

/* ---------- new insight views ---------- */
table.hm{border-collapse:collapse;width:100%;font-size:13px}
table.hm th{background:#172a4d;color:var(--text-secondary);font-weight:600;padding:8px 10px;text-align:right;border-bottom:1px solid var(--border-strong);white-space:nowrap}
table.hm th:first-child,table.hm td:first-child{text-align:left}
table.hm td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
table.hm td:first-child{font-weight:600;cursor:pointer}
table.hm td.g{background:rgba(12,163,12,.28)} table.hm td.w{background:rgba(250,178,25,.30)} table.hm td.c{background:rgba(208,59,59,.42)}
table.hm tbody tr:hover td:first-child{color:var(--accent)}
.spark{vertical-align:middle}
.sevchip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600}
.sevchip.hi{background:rgba(208,59,59,.25);color:#ff9d9d}.sevchip.md{background:rgba(250,178,25,.22);color:#fbc54d}.sevchip.lo{background:rgba(150,180,240,.18);color:var(--text-secondary)}

/* ---------- meeting plan ---------- */
.mtg-ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.mtg-ctl label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--text-muted)}
.mtg-ctl input[type=number]{width:96px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 8px}
.fhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px}
.fchip{display:inline-flex;gap:5px;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:3px 10px;font-size:12px;color:var(--text-secondary)}
.fchip b{color:var(--text-primary)} .fchip.bad{border-color:var(--serious);color:#ffb08f} .fchip.ok{border-color:var(--good)}
.att{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
h4.mh{margin:12px 0 4px;font-size:13px;color:var(--text-secondary)}
</style>
</head>
<body>
<header class="top">
  <h1>▦ Project Portfolio Viewer</h1>
  <div class="src" id="srcInfo">No file loaded</div>
  <select id="mnav" style="display:none;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px"></select>
  <div class="xmenu" id="pmenu">
    <button class="btn" id="btnPrint" disabled>🖨 Print / PDF ▾</button>
    <div class="xdrop" id="pdrop">
      <button data-print="pack"><b>Management pack…</b><span>multi-page report: choose the sections</span></button>
      <button data-print="view"><b>Current view</b><span id="pViewLbl">what is on screen, on white pages</span></button>
    </div>
  </div>
  <div class="xmenu" id="xmenu">
    <button class="btn" id="btnExport" disabled>⬇ Export to Excel ▾</button>
    <div class="xdrop" id="xdrop">
      <button data-exp="view"><b>Current view</b><span id="xViewLbl">tables as shown on screen</span></button>

/* =====================================================================
   1. Minimal offline XLSX reader (zip + inflate via DecompressionStream)
   ===================================================================== */
async function unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error('Not a valid .xlsx (zip) file');
  const n=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true);
  const files={}, dec=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    files[name]={method,csize,off};
    p+=46+nl+el+cl;
  }
  return {
    has:name=>!!files[name],
    async text(name){
      const f=files[name]; if(!f) return null;
      const lnl=dv.getUint16(f.off+26,true), lel=dv.getUint16(f.off+28,true);
      const data=u8.subarray(f.off+30+lnl+lel, f.off+30+lnl+lel+f.csize);
      if(f.method===0) return dec.decode(data);
      const ds=new DecompressionStream('deflate-raw');
      const out=await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer();
      return dec.decode(out);
    }
  };
}
function colIdx(ref){let c=0;for(const ch of ref){const k=ch.charCodeAt(0);if(k<65||k>90)break;c=c*26+(k-64);}return c-1;}
function kids(el,tag){const o=[];for(const c of el.children) if(c.localName===tag) o.push(c);return o;}
function txtOf(el){let s='';for(const t of el.getElementsByTagName('*')) if(t.localName==='t') s+=t.textContent;return s;}
async function readXlsx(buf){
  const z=await unzip(buf), P=new DOMParser();
  const xml=async n=>{const t=await z.text(n);return t?P.parseFromString(t,'application/xml'):null;};
  const wb=await xml('xl/workbook.xml'), rels=await xml('xl/_rels/workbook.xml.rels');
  const rmap={}; for(const r of rels.getElementsByTagName('*')) if(r.localName==='Relationship') rmap[r.getAttribute('Id')]=r.getAttribute('Target');
  let shared=[]; const ssx=await xml('xl/sharedStrings.xml');
  if(ssx) shared=[...ssx.documentElement.children].filter(e=>e.localName==='si').map(txtOf);
  const sheets=[];
  for(const s of wb.getElementsByTagName('*')){
    if(s.localName!=='sheet') continue;
    const rid=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let tgt=rmap[rid]||''; tgt=tgt.replace(/^\/?xl\//,'').replace(/^\//,'');
    const doc=await xml('xl/'+tgt); if(!doc) continue;
    const rows=[];
    for(const r of doc.getElementsByTagName('*')){
      if(r.localName!=='row') continue;
      const ri=+r.getAttribute('r')-1, arr=[];
      for(const c of kids(r,'c')){
        const t=c.getAttribute('t'), vEl=kids(c,'v')[0]; let v=vEl?vEl.textContent:null;
        if(t==='s') v=v!=null?shared[+v]:null;
        else if(t==='inlineStr') v=txtOf(c);
        else if(t==='b') v=v==='1';
        else if(t==='str'||t==='e') {}

}

/* ---------- minimal XLSX writer (stored zip, inline strings) ---------- */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

  const enc=new TextEncoder(), parts=[], central=[]; let off=0;

    const nm=enc.encode(name), data=enc.encode(txt), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);

  const csize=central.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);

}
/* sheets: [{name, cols:[{label,width,type:'text'|'eur'|'pct'|'int'|'wrap'}], rows:[[...]]}] */

/* =====================================================================
   2. Data model
   ===================================================================== */
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CATS=[['eq','Equipment','Equip'],['lab','Labour','Labour'],['ext','External','External'],['oth','Other','Other']];
let BASE_YEAR=2026;
const S={projects:[],lines:[],decisions:[],reportDate:new Date(),title:'',file:'',
  view:'overview',dataset:'projects',filters:{q:'',bu:'',pm:'',client:'',sched:'',cost:'',dq:''},topN:10,cur:'€',opts:{}};

function num(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  let s=String(v).trim(); if(!s||/^[—–\-�]+$/.test(s)) return null;
  const pct=s.endsWith('%'); s=s.replace(/[%\s,€]/g,'');
  const n=parseFloat(s); if(!isFinite(n)) return null;
  return pct?n/100:n;
}
function pct(v){const n=num(v);if(n==null)return null;return typeof v==='number'&&Math.abs(n)>1.5?n/100:n;}
function str(v){if(v==null)return '';const s=String(v).trim();return /^[—–\-�]+$/.test(s)?'':s;}
function date(v){
  if(v==null||v==='') return null;
  if(typeof v==='number'){ if(v>20000&&v<80000) return new Date(Math.round((v-25569)*864e5)); return null; }
  const s=String(v).trim(); let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/); if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  const d=new Date(s); return isNaN(d)?null:d;
}
function isRealRisk(s){return s && s.replace(/[^A-Za-zĂÂÎȘȚăâîșțşţ]/g,'').length>=3;}

function parseProjectSheet(sh){
  const rows=sh.rows; let hi=rows.findIndex(r=>r&&r.some(c=>typeof c==='string'&&c.trim()==='Project Number'));
  if(hi<0) return null;
  const H={}; rows[hi].forEach((h,i)=>{if(h!=null) H[String(h).trim()]=i;});
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const g=h=>H[h]!=null?r[H[h]]:null;
    const id=str(g('Project Number')), first=str(r[0]);
    if(!id || /^total/i.test(first)) continue;
    const series=metric=>{
      const a=new Array(36).fill(0); let any=false;
      for(let y=0;y<3;y++) for(let m=0;m<12;m++){
        const key=y===0?`${MONTHS[m]} ${metric}`:`${MONTHS[m]} ${BASE_YEAR+y} ${metric}`;
        const v=num(g(key)); if(v!=null){a[y*12+m]=v; if(v) any=true;}
      }
      const yt=[num(g(`Total ${BASE_YEAR} ${metric}`)),num(g(`${BASE_YEAR+1} ${metric}`)),num(g(`${BASE_YEAR+2} ${metric}`))];
      return {m:a,any,yt:yt.map((v,k)=>v!=null?v:a.slice(k*12,k*12+12).reduce((s,x)=>s+x,0))};
    };
    const p={
      bu:str(g('BU')||g('BUs Involved')), id, name:str(g('Project Name')), client:str(g('Client')), pm:str(g('PM')),
      status:str(g('Project Status')), sched:str(g('Schedule')), costSt:str(g('Cost Status')),
      cv:num(g('Contract Value'))||0, vo:num(g('VO Value'))||0, tc:num(g('TOTAL Contract')), ccost:num(g('Contract Cost'))||0,
      cmFile:pct(g('Contract Margin %')), emFile:pct(g('EAC Margin %')),
      bud:{}, act:{}, etc:{},
      actTot:num(g('Actual Cost'))||0, etcTot:num(g('ETC Total'))||0, eac:num(g('EAC Total')),
      actRev:num(g('Actual Revenue'))||0, revEtc:num(g('Revenue ETC'))||0,
      risks:[str(g('Risk 1')),str(g('Risk 2'))].filter(isRealRisk),
      dSign:date(g('Contract Signing Date')), dFinal:date(g('Contract Final Completion Date')), dFcst:date(g('Contract Forecasted Final Completion Date'))
    };
    if(p.tc==null) p.tc=p.cv+p.vo;
    if(p.eac==null) p.eac=p.actTot+p.etcTot;
    for(const [k,lab] of CATS){ p.bud[k]=num(g('Budget: '+lab))||0; p.act[k]=num(g('Actual '+lab))||0; p.etc[k]=num(g('ETC '+lab))||0; }
    p.rev=series('Revenue'); p.cost=series('Costs'); p.cin=series('Cash In'); p.cout=series('Cash Out');
    p.bus=p.bu.split('/').map(s=>s.trim()).filter(Boolean);
    p.pms=p.pm.split('/').map(s=>s.trim()).filter(Boolean);
    out.push(p);
  }

}
function parseDecisions(sh){
  const rows=sh.rows; const hi=rows.findIndex(r=>r&&r.some(c=>typeof c==='string'&&/^Description$/i.test(c.trim())));
  if(hi<0) return [];
  const H={}; rows[hi].forEach((h,i)=>{if(h!=null) H[String(h).trim()]=i;});
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue; const g=h=>H[h]!=null?r[H[h]]:null;
    const proj=str(g('Project')); if(!proj&&!str(g('Description'))) continue;
    const m=proj.match(/^(\d{5,})/);
    let dt=g('Date'); dt=typeof dt==='number'?date(dt):str(dt);
    out.push({no:str(g('#')),proj,id:m?m[1]:'',type:str(g('Type')),status:str(g('Status')),bu:str(g('BU')),to:str(g('Assigned To')),
      desc:str(g('Description')),res:str(g('Resolution Comment')),by:str(g('Logged By')),date:dt instanceof Date?dt.toISOString().slice(0,10):dt});

/* ---------- derived metrics ---------- */
const KW=[['Delay',/(delay|întârz|intarz|decal|postpon|late)/i],['Penalty',/(penal|liquidated|\bLD\b)/i],['Budget overrun',/(overrun|dep[aă][sș]ir|budget|buget|cost)/i],
  ['Cash / billing',/(cash|plat[aă]|IPC|factur|invoice|payment|încas|incas)/i],['Claim / dispute',/(claim|disput|litig|reclam)/i],['Energisation / commissioning',/(energiz|commission|PIF|SAT\b|FAT\b)/i],['Supply',/(deliver|livr|supplier|furniz|procure)/i]];
const DEFAULT_W={delayed:3,atRisk:4,onHold:2,overBudget:4,erosionPP:1,erosionCap:6,negMargin:5,lowMargin:2,lowMarginPct:5,risk:1,keyword:0.5,decision:1,critical:2,slip30:2,sizePow:0.5};
let W=Object.assign({},DEFAULT_W);
try{const s=JSON.parse(localStorage.getItem('ppv_weights')||'null'); if(s) W=Object.assign(W,s);}catch(e){}

function derive(p){
  p.cm = p.tc? (p.tc-p.ccost)/p.tc : p.cmFile;
  p.em = p.tc? (p.tc-p.eac)/p.tc : p.emFile;
  p.cmVal=p.tc-p.ccost; p.emVal=p.tc-p.eac;
  p.eroPP=(p.cm-p.em)*100; p.eroVal=p.eac-p.ccost;
  p.overPct=p.ccost?(p.eac-p.ccost)/p.ccost:null;
  p.pctCost=p.eac?p.actTot/p.eac:0; p.pctBill=p.tc?p.actRev/p.tc:0;
  p.billPos=p.actRev-p.pctCost*p.tc;
  p.totRev=p.actRev+p.revEtc;
  p.eacCat={}; for(const [k] of CATS) p.eacCat[k]=p.act[k]+p.etc[k];
  p.pctSpent=p.ccost?p.actTot/p.ccost:null;
  p.timeEl=(p.dSign&&p.dFcst&&p.dFcst>p.dSign)?Math.max(0,(S.reportDate-p.dSign)/(p.dFcst-p.dSign)):null;
  p.burnVsTime=(p.pctSpent!=null&&p.timeEl!=null)?(p.pctSpent-Math.min(p.timeEl,1))*100:null;
  p.burnVsBill=(p.pctSpent!=null&&p.tc)?(p.pctSpent-p.pctBill)*100:null;
  // data-quality flag: no remaining cost entered although the project is not completed
  p.etcGap=null;
  if(p.etcTot<=0 && !/complet/i.test(p.sched)){
    const why=[];
    if(p.ccost>0 && p.eac<0.9*p.ccost) why.push(`EAC is only ${pctF(p.eac/p.ccost,0)} of budget`);
    if(p.revEtc>0) why.push(`${money(p.revEtc)} revenue still to bill`);
    if(why.length) p.etcGap='ETC = 0 but project not completed: '+why.join(', ')+'. EAC margin is probably overstated.';
  }
  const cin=p.cin.m, cout=p.cout.m; let cum=0,min=0,minI=-1; p.net=new Array(36);
  for(let i=0;i<36;i++){p.net[i]=cin[i]-cout[i];cum+=p.net[i];if(cum<min){min=cum;minI=i;}}
  p.netCash=(p.cin.any||p.cout.any)?cum:(p.cin.yt.reduce((a,b)=>a+b,0)-p.cout.yt.reduce((a,b)=>a+b,0));
  p.peakFund=min; p.peakFundI=minI;
  p.slip=(p.dFcst&&p.dFinal)?Math.round((p.dFcst-p.dFinal)/864e5):null;
  p.toFinish=p.dFcst?Math.round((p.dFcst-S.reportDate)/864e5):null;
  p.decs=S.decisions.filter(d=>d.id===p.id && (!p.isLine||!d.bu||d.bu===p.bu));
  p.openDecs=p.decs.filter(d=>!/closed|resolved|done/i.test(d.status));

}

  const b=[]; const add=(l,v)=>{if(v) b.push([l,v]);};
  const sc=p.sched.toLowerCase();

  if(sc.includes('risk')) add('Schedule: At Risk',W.atRisk);
  if(sc.includes('hold')) add('Schedule: On Hold',W.onHold);
  if(/over/i.test(p.costSt)) add('Cost: Over Budget',W.overBudget);
  if(p.eroPP>0) add(`Margin erosion ${p.eroPP.toFixed(1)} pp`,Math.min(W.erosionCap,p.eroPP*W.erosionPP));
  if(p.em<0) add('Negative EAC margin',W.negMargin); else if(p.em*100<W.lowMarginPct) add(`EAC margin < ${W.lowMarginPct}%`,W.lowMargin);
  add(`${p.risks.length} stated risk(s)`,p.risks.length*W.risk);
  add(`Keywords: ${p.kw.join(', ')}`,p.kw.length*W.keyword);
  const crit=p.openDecs.filter(d=>/critical/i.test(d.type)).length, dec=p.openDecs.length-crit;
  add(`${dec} open decision(s)`,dec*W.decision); add(`${crit} open critical issue(s)`,crit*W.critical);

  p.riskParts=b; p.risk=b.reduce((s,[,v])=>s+v,0);

function recompute(){
  for(const arr of [S.projects,S.lines]) arr.forEach(derive);
  const all=[...S.projects,...S.lines];
  all.forEach(riskScore);
  for(const arr of [S.projects,S.lines]){
    const tcs=arr.map(p=>p.tc).filter(v=>v>0).sort((a,b)=>a-b), med=tcs[Math.floor(tcs.length/2)]||1;
    arr.forEach(p=>p.exposure=p.risk*Math.pow(Math.max(p.tc,0)/med,W.sizePow));
  }
}

    getters.push(r=>{const v=c.get(r); if(v==null) return null; if(type==='text'&&typeof v==='number'&&c.fmt) return c.fmt(v); return v;});
  }
  return {name:SHEET_NAMES[id]||id,cols,rows:t.rows.map(r=>getters.map(g=>g(r)))};
}

const opt=(k,d)=>S.opts[k]??d;
function seg(key,options,def){
  const cur=opt(key,def);
  return `<div class="seg" data-seg="${key}">${options.map(([v,l])=>`<button data-v="${v}" class="${cur===v?'on':''}">${esc(l)}</button>`).join('')}</div>`;
}
function vhead(title,desc,ctl=''){return `<div class="vhead"><div><h2>${esc(title)}</h2><p>${desc}</p></div><div class="ctl">${ctl}</div></div>`;}
function topN(arr,get,dir=-1){
  const ok=p=>get(p)!=null&&isFinite(get(p));
  const r=[...arr].filter(ok).sort((a,b)=>(get(a)-get(b))*dir);
  if(S.filters.q) r.push(...arr.filter(p=>!ok(p))); // while searching, keep matches that have no value for this metric
  return S.topN?r.slice(0,S.topN):r;
}
const searchNote=()=>S.filters.q?`<div class="note" style="margin:-4px 0 10px">🔍 Search “${esc(S.filters.q)}” is active, so this view also shows matched projects it would normally leave out (zero or empty values).</div>`:'';
function rankView({id,title,desc,ctl='',metric,dir=-1,fmt=money,diverging=false,cols,chartExtra='',tipExtra,filterFn,colorFn,above=''}){
  let rows=filtered(); if(filterFn&&!S.filters.q) rows=rows.filter(filterFn);
  const top=topN(rows,metric,dir);
  const items=top.map(p=>({label:p.name+(S.dataset==='lines'?` · ${p.bu.replace(/ BU$/,'')}`:''),warn:!!p.etcGap,value:metric(p),id:keyOf(p),color:colorFn?colorFn(p):null,tip:projTip(p,tipExtra?tipExtra(p):[])}));
  const nWarn=top.filter(p=>p.etcGap).length;
  if(nWarn) chartExtra+=`<div class="warnnote">⚠ ${nWarn} of these projects have ETC = 0 although they are not completed, so their EAC margin is probably overstated. <span class="scr">Hover the ⚠ for details, or use <b>Data check</b> to exclude them.</span>${xlsxBtn}</div>`;
  return vhead(title,desc,ctl)+searchNote()+above+
    `<div class="card"><h3>${S.topN?`Top ${Math.min(S.topN,top.length)}`:'All'}<small>${rows.length} in selection</small></h3>${chartExtra}${hbar(items,{fmt,diverging})}</div>`+
    `<div class="card"><h3>Details <button class="btn small" style="float:right" data-csv="${id}">⬇ Excel</button></h3>${table(id,top,cols,{defSort:null})}</div>`;
}

/* ---------- overview ---------- */
function sumArr(arr,f){return arr.reduce((s,p)=>s+(f(p)||0),0);}
function sumSeries(arr,k){const a=new Array(36).fill(0);arr.forEach(p=>p[k].m.forEach((v,i)=>a[i]+=v));return a;}
function renderOverview(){
  const rows=filtered(); const tc=sumArr(rows,p=>p.tc), eac=sumArr(rows,p=>p.eac), cc=sumArr(rows,p=>p.ccost);
  EXTRA_SHEETS.push(()=>allProjectSheets()[0]);
  EXTRA_SHEETS.push(()=>{const r=sumSeries(rows,'rev'),c=sumSeries(rows,'cost'),ci=sumSeries(rows,'cin'),co=sumSeries(rows,'cout');let cum=0;
    return {name:'Monthly portfolio',cols:[{label:'Month',width:10},{label:'Revenue',width:15,type:'eur'},{label:'Costs',width:15,type:'eur'},{label:'Cash in',width:15,type:'eur'},{label:'Cash out',width:15,type:'eur'},{label:'Net cash',width:15,type:'eur'},{label:'Cumulative net cash',width:17,type:'eur'}],
      rows:r.map((v,i)=>{const n=ci[i]-co[i];cum+=n;return [monthLabel(i),v,c[i],ci[i],co[i],n,cum];})};});
  const em=tc?(tc-eac)/tc:0, cm=tc?(tc-cc)/tc:0;
  const delayed=rows.filter(p=>/delay|risk|hold/i.test(p.sched)).length, over=rows.filter(p=>/over/i.test(p.costSt)).length;
  const openD=S.decisions.filter(d=>!/closed|resolved|done/i.test(d.status)&&rows.some(p=>p.id===d.id)).length;
  const k=(l,v,s)=>`<div class="kpi"><div class="l">${l}</div><div class="v num">${v}</div><div class="s">${s||''}</div></div>`;
  let h=vhead('Portfolio overview',`${rows.length} ${S.dataset==='lines'?'BU project lines':'projects'} in the current selection. <span class="scr">Click any bar or row to open the project detail.</span>`);
  h+=`<div class="kpis">${k('Total contract',money(tc),`VO ${money(sumArr(rows,p=>p.vo))}`)}${k('EAC margin',money(tc-eac),`${pctF(em)} vs contract ${pctF(cm)}`)}${k('Margin erosion',pp((cm-em)*100),money(eac-cc)+' cost growth')}${k('Backlog (Revenue ETC)',money(sumArr(rows,p=>p.revEtc)),`Actual revenue ${money(sumArr(rows,p=>p.actRev))}`)}${k(`${BASE_YEAR} revenue fcst`,money(sumArr(rows,p=>p.rev.yt[0])),`${BASE_YEAR+1}: ${money(sumArr(rows,p=>p.rev.yt[1]))}`)}${k('Schedule issues',delayed,'Delayed / At Risk / On Hold')}${k('Over budget',over,'Cost status')}${k('Open decisions / issues',openD,'from the Decisions sheet')}<div class="kpi" style="cursor:pointer;border-color:rgba(250,178,25,.45)" id="dqKpi"><div class="l">⚠ ETC = 0, not completed</div><div class="v num" style="color:var(--warning)">${rows.filter(p=>p.etcGap).length}</div><div class="s">EAC margin likely overstated <span class="scr">· click to list</span></div><button class="btn small" data-xlsx="flagged" style="margin-top:6px">⬇ Export to Excel</button></div></div>`;
  const rev=sumSeries(rows,'rev'), cost=sumSeries(rows,'cost'), cin=sumSeries(rows,'cin'), cout=sumSeries(rows,'cout');
  const net=cin.map((v,i)=>v-cout[i]); let c=0; const cum=net.map(v=>c+=v);
  h+=`<div class="card"><h3>Monthly revenue vs cost forecast<small>${BASE_YEAR}–${BASE_YEAR+2}</small></h3>${legend([['Revenue','var(--series-1)',1],['Costs','var(--series-2)',1]])}${monthly([{name:'Revenue',color:'var(--series-1)',values:rev},{name:'Costs',color:'var(--series-2)',values:cost}])}</div>`;
  h+=`<div class="grid2"><div class="card"><h3>Monthly net cash<small>cash in − cash out</small></h3>${legend([['Net inflow','var(--pos)'],['Net outflow','var(--neg)']])}${monthly([{name:'Net cash',type:'bar',values:net}],{h:220})}</div>`;
  h+=`<div class="card"><h3>Cumulative net cash<small>from Jan ${BASE_YEAR}</small></h3>${legend([['Cumulative','var(--series-3)',1]])}${monthly([{name:'Cumulative',color:'var(--series-3)',values:cum}],{h:220})}</div></div>`;
  // by BU (always from BU lines when available)
  const src=S.lines.length?filtered(S.lines):rows, bu={};
  src.forEach(p=>p.bus.forEach(b=>{const o=bu[b]||(bu[b]={tc:0,eac:0,n:0,cc:0});o.tc+=p.tc/(S.lines.length?1:p.bus.length);o.eac+=p.eac/(S.lines.length?1:p.bus.length);o.cc+=p.ccost/(S.lines.length?1:p.bus.length);o.n++;}));
  const bi=Object.entries(bu).sort((a,b)=>b[1].tc-a[1].tc).map(([b,o])=>({label:b,value:o.tc,tip:`<div class="h">${esc(b)}</div>`+tipRows([['Lines',o.n],['Contract',money(o.tc)],['EAC margin',`${money(o.tc-o.eac)} (${pctF((o.tc-o.eac)/o.tc)})`],['Contract margin %',pctF((o.tc-o.cc)/o.tc)]])}));
  const bm=Object.entries(bu).sort((a,b)=>b[1].tc-a[1].tc).map(([b,o])=>({label:b,value:o.tc?(o.tc-o.eac)/o.tc:0,tip:`<div class="h">${esc(b)}</div>`+tipRows([['EAC margin %',pctF((o.tc-o.eac)/o.tc)],['Contract margin %',pctF((o.tc-o.cc)/o.tc)]])}));
  h+=`<div class="grid2" style="margin-top:14px"><div class="card"><h3>Contract value by BU</h3>${hbar(bi,{labelW:150})}</div><div class="card"><h3>EAC margin % by BU</h3>${hbar(bm,{labelW:150,fmt:pctF,diverging:true})}</div></div>`;
  // status mix
  const cnt=f=>{const o={};rows.forEach(p=>{const v=f(p)||'—';o[v]=(o[v]||0)+1;});return Object.entries(o).sort((a,b)=>b[1]-a[1]);};
  h+=`<div class="card" style="margin-top:14px"><h3>Status mix</h3><div style="display:flex;gap:28px;flex-wrap:wrap"><div><div class="note" style="margin-bottom:6px">Schedule</div>${cnt(p=>p.sched).map(([s,n])=>`<div style="margin:4px 0">${statusChip(s,'sched')} <b class="num">${n}</b></div>`).join('')}</div><div><div class="note" style="margin-bottom:6px">Cost</div>${cnt(p=>p.costSt).map(([s,n])=>`<div style="margin:4px 0">${statusChip(s,'cost')} <b class="num">${n}</b></div>`).join('')}</div></div></div>`;
  return h;
}

function renderRisk(){
  const b=opt('kBasis','exp');
  const rows=filtered().filter(p=>p.risk>0||S.filters.q);
  const top=topN(rows,b==='exp'?p=>p.exposure:p=>p.risk);
  const items=top.map(p=>({label:p.name+(S.dataset==='lines'?` · ${p.bu.replace(/ BU$/,'')}`:''),value:b==='exp'?p.exposure:p.risk,id:keyOf(p),

/* ---------- project x BU matrix ---------- */
function renderMatrix(){
  const rows=filtered(S.projects).slice().sort((a,b)=>b.tc-a.tc);
  const all=[...S.projects,...S.lines];
  const bus=[...new Set(all.flatMap(p=>p.bus).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const LI=new Map(); S.lines.forEach(l=>{(LI.get(l.id)||LI.set(l.id,[]).get(l.id)).push(l);});
  const sc=s=>{const l=(s||'').toLowerCase(); return l.includes('track')||l.includes('complet')?'var(--good)':l.includes('delay')?'var(--serious)':l.includes('risk')?'var(--critical)':l.includes('hold')?'var(--warning)':'var(--text-muted)';};
  const uq=a=>[...new Set(a.filter(Boolean))];
  const cellInfo=(p,b)=>{
    const ls=(LI.get(p.id)||[]).filter(l=>l.bus.includes(b));
    if(!ls.length && !p.bus.includes(b)) return null;
    const linePM=uq(ls.flatMap(l=>l.pms)), projPM=p.pms, allPM=uq([...linePM,...projPM]);
    const r=ls.length?ls[0]:p;
    return {ls,linePM,projPM,allPM,r};
  };
  const grid=rows.map(p=>({p,cells:bus.map(b=>cellInfo(p,b))}));
  const colN=bus.map((b,j)=>grid.filter(g=>g.cells[j]).length);
  EXTRA_SHEETS.push(()=>({name:'Project x BU matrix',cols:[{label:'Project number',width:13},{label:'Project name',width:38,type:'wrap'},{label:'Client',width:26},...bus.map(b=>({label:b,width:24,type:'wrap'})),{label:'# BUs',width:8,type:'int'}],
    rows:[...grid.map(g=>[g.p.id,g.p.name,g.p.client,...g.cells.map(c=>c?c.allPM.join(' / ')||'(no PM)':''),g.cells.filter(Boolean).length]),['','Projects per BU','',...colN,'']]}));
  const head=`<thead><tr><th class="corner">Project</th>${bus.map(b=>`<th data-group="${esc(b)}" data-gdim="bu" title="Filter by ${esc(b)}">${esc(b.replace(/ BU$/,''))}</th>`).join('')}<th class="tot"># BUs</th></tr></thead>`;
  const body=grid.map(({p,cells})=>`<tr><td class="pn" data-open="${esc(p.id+'|')}"><span class="n">${p.etcGap?'<span class="warn">⚠</span> ':''}${esc(p.name)}</span><span class="sub">${esc(p.id)} · ${esc(p.client||'—')}</span></td>`+
    cells.map((c,j)=>{
      if(!c) return '<td class="c"></td>';
      const r=c.r, extra=c.linePM.length&&c.projPM.length&&c.linePM.join('|')!==c.projPM.join('|');
      const t=`<div class="h">${esc(c.allPM.join(', ')||'(no PM assigned)')}</div>`+tipRows([
        ['Project',esc(p.name)],['BU',esc(bus[j])],
        ...(extra?[['BU-line PM',esc(c.linePM.join(', '))],['Project PM',esc(c.projPM.join(', ')||'—')]]:[]),
        ['Contract',money(r.tc)],['Schedule',esc(r.sched||'—')],['Cost status',esc(r.costSt||'—')],['EAC margin',r.em!=null?pctF(r.em):'—']]);
      return `<td class="c on" data-mx="${esc(p.id+'|'+bus[j])}" ${tipAttr(t)}><i style="background:${sc(r.sched)}"></i></td>`;
    }).join('')+`<td class="tot">${cells.filter(Boolean).length}</td></tr>`).join('');
  const foot=`<tfoot><tr><td class="pn">Projects per BU</td>${colN.map(n=>`<td>${n}</td>`).join('')}<td>${rows.length}</td></tr></tfoot>`;
  return vhead('Project × BU matrix','One row per project, one column per BU. A block marks the BUs involved in the project; <b>hover</b> a block to see the PM(s). <span class="scr">Click a block to filter the app to that project and BU; click a BU header to filter by BU.</span>',
      '<button class="btn small" data-csv-mx="1" onclick="exportMatrix()">⬇ Excel</button>')+
    `<div class="card" style="padding:10px">${legend([['On track / completed','var(--good)'],['Delayed','var(--serious)'],['At risk','var(--critical)'],['On hold','var(--warning)'],['Other / n.a.','var(--text-muted)']])}
    <p class="note" style="margin:0 0 8px">Block colour = schedule status (of the BU line when available, otherwise of the project). Shows all ${rows.length} projects matching the filters, regardless of the “Show” selector. “All PMs” = BU-line PMs plus project PMs.</p>
    <div class="mxwrap"><table class="mx">${head}<tbody>${body}</tbody>${foot}</table></div></div>`;
}
function exportMatrix(){
  const sh=EXTRA_SHEETS[0]&&EXTRA_SHEETS[0](); if(!sh){toast('Nothing to export');return;}

/* =====================================================================
   Insight views: PM workload, BU heatmap, margin bridge, BU timeline, concentration, data quality
   ===================================================================== */
/* records split by BU / PM (BU-line sheet when loaded; money split equally across multiple BUs/PMs on project rows) */
function splitRecs(dim){
  const L=S.lines.length, src=L?filtered(S.lines):filtered(S.projects);
  return src.flatMap(p=>{ const ks=dim==='bu'?(p.bus.length?p.bus:['—']):(p.pms.length?p.pms:['—']);
    const share=(dim==='bu'&&L)?1:ks.length; const keys=(dim==='bu'&&L)?[p.bu||ks[0]]:ks;
    return keys.map(k=>({k,p,w:1/share})); });
}
function aggRecs(recs){
  const G={};
  recs.forEach(({k,p,w})=>{const g=G[k]||(G[k]={name:k,n:0,ids:new Set(),tc:0,eac:0,cc:0,revEtc:0,rev0:0,risk:0,issues:0,over:0,open:0,flags:0,cm:0,em:0,rev:new Array(36).fill(0),slipSum:0,slipN:0});
    g.n++; g.ids.add(p.id); g.tc+=p.tc*w; g.eac+=p.eac*w; g.cc+=p.ccost*w; g.revEtc+=p.revEtc*w; g.rev0+=p.rev.yt[0]*w; g.risk+=(p.risk||0)*w;

/* ---------- 3. Margin bridge (waterfall) ---------- */
function waterfall(steps,{h=300}={}){
  const W0=900,padL=70,padR=16,top=24,bot=54; let cum=0; const bars=steps.map(s=>{ if(s.total){cum=s.v;return {...s,y0:0,y1:s.v,end:s.v};} const y0=cum; cum+=s.v; return {...s,y0,y1:cum,end:cum}; });
  const all=bars.flatMap(b=>[b.y0,b.y1]), mn=Math.min(0,...all), mx=Math.max(0,...all), ticks=niceTicks(mn,mx,5), t0=ticks[0], t1=ticks[ticks.length-1];
  const y=v=>top+(1-(v-t0)/(t1-t0||1))*(h-top-bot), bw=(W0-padL-padR)/bars.length, w=Math.min(70,bw-14);
  let s=`<svg viewBox="0 0 ${W0} ${h}" width="100%" style="display:block">`;
  for(const t of ticks) s+=`<line x1="${padL}" x2="${W0-padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${padL-8}" y="${y(t)+4}" text-anchor="end" class="muted num">${esc(money(t,1))}</text>`;
  bars.forEach((b,i)=>{ const x=padL+bw*i+(bw-w)/2, ya=y(Math.max(b.y0,b.y1)), yb=y(Math.min(b.y0,b.y1)), hh=Math.max(2,yb-ya);
    const col=b.total?'var(--series-1)':(b.v<0?'var(--neg)':'var(--series-3)');
    s+=`<rect x="${x}" y="${ya}" width="${w}" height="${hh}" rx="3" fill="${col}" ${tipAttr(`<div class="h">${esc(b.label)}</div>`+tipRows([[b.total?'Value':'Change',money(b.v)],['Running total',money(b.end)]]))}/>`;
    s+=`<text x="${x+w/2}" y="${ya-5}" text-anchor="middle" class="num">${esc(money(b.v))}</text>`;
    s+=`<text x="${x+w/2}" y="${h-bot+16}" text-anchor="middle" class="muted">${esc(b.label.length>16?b.label.slice(0,15)+'…':b.label)}</text>`;
    if(i<bars.length-1) s+=`<line x1="${x+w}" x2="${x+bw}" y1="${y(b.end)}" y2="${y(b.end)}" stroke="var(--axis)" stroke-dasharray="3 3"/>`; });
  return s+`<line x1="${padL}" x2="${W0-padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1.5"/></svg>`;
}
function renderBridge(){
  const src=S.lines.length?filtered(S.lines):filtered(S.projects);

  const cm=sum(p=>p.cmVal), em=sum(p=>p.emVal), catD=CATS.map(([k,l])=>({k,l,bud:sum(p=>p.bud[k]),eac:sum(p=>p.eacCat[k])}));
  const steps=[{label:'Contract margin',v:cm,total:1}];
  catD.forEach(c=>steps.push({label:c.l+(c.eac>c.bud?' overrun':c.eac<c.bud?' saving':''),v:-(c.eac-c.bud)}));
  const resid=(em-cm)-steps.slice(1).reduce((a,s)=>a+s.v,0);
  if(Math.abs(resid)>1) steps.push({label:'Unallocated',v:resid});
  steps.push({label:'EAC margin',v:em,total:1});
  EXTRA_SHEETS.push(()=>({name:'Margin bridge',cols:[{label:'Step',width:28},{label:'Value',width:16,type:'eur'}],rows:steps.map(s=>[s.label,s.v])}));

}

function stacked(names,cols,data,{h=270}={}){
  const W0=900,padL=64,padR=16,top=12,bot=28,n=36;
  const pos=Array(n).fill(0),neg=Array(n).fill(0); data.forEach(a=>a.forEach((v,i)=>{if(v>=0)pos[i]+=v;else neg[i]+=v;}));
  const ticks=niceTicks(Math.min(0,...neg),Math.max(0,...pos),5), t0=ticks[0], t1=ticks[ticks.length-1];
  const y=v=>top+(1-(v-t0)/(t1-t0||1))*(h-top-bot), bw=(W0-padL-padR)/n;
  let s=`<svg viewBox="0 0 ${W0} ${h}" width="100%" style="display:block">`;
  for(const t of ticks) s+=`<line x1="${padL}" x2="${W0-padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${padL-8}" y="${y(t)+4}" text-anchor="end" class="muted num">${esc(money(t,1))}</text>`;
  for(let i=0;i<n;i++){
    if(i%3===0) s+=`<text x="${padL+bw*i+bw/2}" y="${h-10}" text-anchor="middle" class="muted">${monthLabel(i)}</text>`;
    if(i%12===0&&i) s+=`<line x1="${padL+bw*i}" x2="${padL+bw*i}" y1="${top}" y2="${h-bot}" stroke="var(--axis)" stroke-dasharray="3 3"/>`;
    let pb=0,nb=0;
    data.forEach((a,k)=>{const v=a[i]; if(!v) return; let ya,yb; if(v>=0){ya=y(pb+v);yb=y(pb);pb+=v;}else{ya=y(nb);yb=y(nb+v);nb+=v;}
      s+=`<rect x="${padL+bw*i+1}" y="${ya}" width="${Math.max(2,bw-2)}" height="${Math.max(.5,yb-ya)}" fill="${cols[k]}"/>`;});
    const tot=data.reduce((a,x)=>a+x[i],0);
    s+=`<rect class="hit" x="${padL+bw*i}" y="${top}" width="${bw}" height="${h-top-bot}" ${tipAttr(`<div class="h">${monthLabel(i)}</div>`+tipRows([...names.map((nm,k)=>[nm,money(data[k][i])]).filter((r,k)=>data[k][i]),['Total',money(tot)]]))}/>`;
  }
  return s+`<line x1="${padL}" x2="${W0-padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1.5"/></svg>`;
}

    if(done(p)&&(p.revEtc>0||p.etcTot>0)) add('Completed with remaining values','md',p,`Completed, but backlog ${money(p.revEtc)} / ETC ${money(p.etcTot)} remain.`);

      else{
        p.bus.filter(b=>!ls.some(l=>l.bus.includes(b))).forEach(b=>add('BU without BU line','md',p,`${b} is listed on the project but has no BU line.`));

}

  const all=S.projects, projs=filtered(S.projects);
  const pct=(arr,q)=>{const a=arr.filter(v=>v!=null).sort((x,y)=>y-x); return a.length?a[Math.min(a.length-1,Math.floor(a.length*q))]:Infinity;};

  const avgRisk=all.length?all.reduce((a,p)=>a+(p.risk||0),0)/all.length:1||1, maxTc=Math.max(1,...all.map(p=>p.tc));

    if(level!=='bu'&&iss&&!reasons.some(r=>/issue|delay|risk/i.test(r))) reasons.push('Schedule / cost issue ('+(p.sched||'—')+' / '+(p.costSt||'—')+')');

  items.forEach(it=>{ const lvl=it.level==='bu'?'bu':it.level; const F=it.level==='bu'?mk(it.forum,'BU meeting — '+it.forum.slice(3),'bu',B.bu):forums[it.level]; F.items.push(it); });

    F.items.sort((a,b)=>b.pri-a.pri); let used=0;
    F.items.forEach(it=>{ if(used+it.need<=F.budget||it.crit){it.parked=false;used+=it.need;} else it.parked=true; });
    F.items.forEach((it,i)=>it.ord=i+1);

    F.needAll=F.items.reduce((a,i)=>a+i.need,0); F.used=used; F.recDur=F.items.length?Math.min(180,Math.max(30,roundUp(F.needAll*1.1,15))):0;

function budgetRoll(ctl,flagNote){
  const dim=opt('bDim','bu');

  src.forEach(p=>{const keys=dim==='bu'?(p.bus.length?p.bus:['—']):(p.pms.length?p.pms:['—']), sh=keys.length;
    keys.forEach(k=>{const g=G[k]||(G[k]={name:k,n:0,b:0,a:0,e:0,flag:0,cat:Object.fromEntries(CATS.map(([c])=>[c,{b:0,a:0,e:0}]))});
      g.n++; g.b+=p.ccost/sh; g.a+=p.actTot/sh; g.e+=p.etcTot/sh; if(p.etcGap) g.flag++;
      CATS.forEach(([c])=>{g.cat[c].b+=p.bud[c]/sh;g.cat[c].a+=p.act[c]/sh;g.cat[c].e+=p.etc[c]/sh;});});});
  const groups=Object.values(G).sort((a,b)=>b.b-a.b), top=S.topN?groups.slice(0,S.topN):groups;

  let h=vhead(`Actual vs budget by ${dim.toUpperCase()}`,'Totals come from the BU-line sheet. On lines with several PMs the values are split equally between them. ⚠ marks groups that contain ETC = 0 lines.',ctl+seg('bDim',[['bu','BU'],['pm','PM']],'bu'))+flagNote;

    {k:'name',label:dim.toUpperCase(),get:g=>g.name},{k:'n',label:'# lines',get:g=>g.n,r:1},{k:'b',label:'Budget',get:g=>g.b,fmt:money,r:1},{k:'a',label:'Actual',get:g=>g.a,fmt:money,r:1},
    {k:'ps',label:'% spent',get:g=>g.b?g.a/g.b:null,fmt:pctF,r:1},{k:'e',label:'ETC',get:g=>g.e,fmt:money,r:1},{k:'eac',label:'EAC',get:g=>g.a+g.e,fmt:money,r:1},
    {k:'v',label:'EAC − budget',get:g=>g.a+g.e-g.b,fmt:money,r:1},{k:'vp',label:'Variance %',get:g=>g.b?(g.a+g.e-g.b)/g.b:null,fmt:pctF,r:1},
    ...CATS.map(([c,l])=>({k:'v_'+c,label:`Δ ${l}`,get:g=>cv(g,c),fmt:money,r:1})),{k:'flag',label:'⚠ lines',get:g=>g.flag,r:1}],
    {defSort:null,openKey:g=>'@'+dim+':'+g.name})}</div>`;
  return h;
}

function openProject(key){
  const p=findRec(key); if(!p) return;

  h+=`<div class="card"><h3>Cost: budget vs estimate at completion (EAC)</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>Category</th><th class="r">Budget</th><th class="r">Actual</th><th class="r">ETC</th><th class="r">EAC</th><th class="r">Variance</th></tr></thead><tbody>

    <p class="note">Contract ${money(p.cv)} + VO ${money(p.vo)} · Contract margin ${pctF(p.cm)} → EAC margin ${pctF(p.em)} · Actual revenue ${money(p.actRev)} (${pctF(p.pctBill)} billed) · Cost spent ${pctF(p.pctCost)} · Billing position ${money(p.billPos)}</p></div>`;
  // monthly
  const hasM=p.rev.any||p.cost.any;
  h+=`<div class="card"><h3>Monthly forecast<small>${BASE_YEAR}–${BASE_YEAR+2}</small></h3>${hasM?legend([['Revenue','var(--series-1)',1],['Costs','var(--series-2)',1]])+monthly([{name:'Revenue',color:'var(--series-1)',values:p.rev.m},{name:'Costs',color:'var(--series-2)',values:p.cost.m}],{h:200})+
    '<h3 style="margin-top:12px">Monthly net cash</h3>'+monthly([{name:'Net cash',type:'bar',values:p.net}],{h:170}):`<p class="note">No monthly forecast. Yearly revenue: ${p.rev.yt.map(money).join(' / ')}</p>`}
    <p class="note">Revenue by year: ${p.rev.yt.map((v,i)=>`${BASE_YEAR+i} ${money(v)}`).join(' · ')} — Net cash over the horizon ${money(p.netCash)}, peak funding ${money(p.peakFund)}${p.peakFundI>=0?' ('+monthLabel(p.peakFundI)+')':''}</p></div>`;
  // dates
  h+=`<div class="card"><h3>Dates</h3><p class="num">Signed ${dfmt(p.dSign)} · Contract completion ${dfmt(p.dFinal)} · Forecast completion ${dfmt(p.dFcst)} · Slip ${days(p.slip)}${p.toFinish!=null?` · ${p.toFinish} days from the report date`:''}</p></div>`;
  // risks
  h+=`<div class="card"><h3>Risks<small>score ${p.risk.toFixed(1)}</small></h3>${p.risks.map(r=>`<div class="risk-item">${esc(r)}</div>`).join('')||'<p class="note">No stated risks.</p>'}
    <div style="margin-top:8px">${p.riskParts.map(([l,v])=>`<span class="pill">${esc(l)} +${v.toFixed(1)}</span>`).join('')}</div></div>`;
  // decisions
  h+=`<div class="card"><h3>Decisions & issues<small>${p.decs.length}</small></h3>${p.decs.map(x=>`<div class="dec-item ${/critical/i.test(x.type)?'crit':''}">${statusChip(x.type,'type')} ${statusChip(x.status,'dec')} <span class="note">${esc(x.bu)} · ${esc(x.to)} · ${esc(x.date)}</span><div style="margin-top:5px">${esc(x.desc)}</div>${x.res?`<div class="note" style="margin-top:4px">↳ ${esc(x.res)}</div>`:''}</div>`).join('')||'<p class="note">None.</p>'}</div>`;
  // BU breakdown
  const parts=S.lines.filter(l=>l.id===p.id);
  if(parts.length>1||(S.dataset==='lines'&&parts.length)){
    h+=`<div class="card"><h3>BU lines</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>BU</th><th>PM</th><th class="r">Contract</th><th class="r">EAC</th><th class="r">EAC margin %</th><th class="r">Erosion</th><th>Schedule</th><th>Cost</th></tr></thead><tbody>${parts.map(l=>`<tr data-open="${esc(l.id+'|'+l.bu)}"><td>${esc(l.bu)}</td><td>${esc(l.pm)}</td><td class="r num">${money(l.tc)}</td><td class="r num">${money(l.eac)}</td><td class="r num">${pctF(l.em)}</td><td class="r num">${pp(l.eroPP)}</td><td>${statusChip(l.sched,'sched')}</td><td>${statusChip(l.costSt,'cost')}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  d.innerHTML=h; d.scrollTop=0; d.classList.add('open'); document.getElementById('scrim').style.display='block';
  document.getElementById('dClose').onclick=closeDrawer;
}

    `<div class="sf">${all.length>12?`${all.length-12} more matches — type more to narrow down · `:''}↑↓ to move · Enter opens · Esc closes${others?' · searches all projects, ignoring the other filters':''}</div>`;

  <ul><li>Reads the <b>Project Summary</b> (one row per project), <b>Consolidated Report</b> (one row per BU line) and <b>Decisions</b> sheets.</li><li>Columns are matched by header name, so column order can change between exports.</li><li>Parsed locally in your browser; the data never leaves this computer.</li></ul></div>`;}
function bindDrop(){
  const d=document.getElementById('drop'); if(!d) return;
  ['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over');}));
  d.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)loadFile(f);});
}
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();if(!e.target.closest('#drop')&&e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0]);});
async function loadFile(f){
  try{
    const sheets=await readXlsx(await f.arrayBuffer());
    const find=re=>sheets.find(s=>re.test(s.name));
    // report metadata (title / generated date / base year)
    const any=sheets[0]; const t1=str(any.rows[0]?.[0]), t2=str(any.rows[1]?.[0]);
    const gm=t2.match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})/);
    S.reportDate=gm?new Date(+gm[3],MONTHS.indexOf(gm[2].slice(0,1).toUpperCase()+gm[2].slice(1,3).toLowerCase()),+gm[1]):new Date();
    if(isNaN(S.reportDate)) S.reportDate=new Date();
    BASE_YEAR=S.reportDate.getFullYear();
    // detect the base year from headers such as "Jan 2027 Revenue"
    for(const s of sheets){const hr=s.rows.find(r=>r&&r.includes('Project Number'));if(hr){const ys=hr.map(h=>String(h||'').match(/^[A-Z][a-z]{2} (\d{4}) /)).filter(Boolean).map(m=>+m[1]);if(ys.length)BASE_YEAR=Math.min(...ys)-1;break;}}
    C.rev26.label=`${BASE_YEAR} revenue`;
    let proj=find(/summary/i), lines=find(/consolidated/i), dec=find(/decision/i);
    const P=proj?parseProjectSheet(proj):null, L=lines?parseProjectSheet(lines):null;
    if(!P&&!L) throw new Error('Could not find a sheet with a "Project Number" header row.');
    S.projects=P||L; S.lines=(P&&L)?L:[]; S.lines.forEach(l=>l.isLine=true);
    S.decisions=dec?parseDecisions(dec):[];
    S.file=f.name; S.title=t1;
    S.filters={q:'',bu:'',pm:'',client:'',sched:'',cost:'',dq:''};
    if(!S.lines.length) S.dataset='projects';
    recompute();
    document.getElementById('srcInfo').textContent=`${f.name} — ${t2||t1} · ${S.projects.length} projects · ${S.lines.length} BU lines · ${S.decisions.length} decisions`;
    document.getElementById('btnLoad').textContent='Load another file…';
    document.getElementById('btnExport').disabled=false;
    document.getElementById('btnPrint').disabled=false;
    render(); toast('Loaded '+f.name);
  }catch(err){
    console.error(err);
    if(!S.projects.length){render();const e=document.getElementById('err');if(e)e.textContent='Could not read the file: '+err.message;} else toast('Could not read the file: '+err.message);
  }
}
render();
</script>
